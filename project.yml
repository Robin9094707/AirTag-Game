name: AirTagQuest
options:
  bundleIdPrefix: eu.simplexsmp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AirTagQuest:
    type: application
    platform: iOS
    sources:
      - path: AirTagQuest
    settings:
      base:
        PRODUCT_NAME: AirTagQuest
        PRODUCT_BUNDLE_IDENTIFIER: eu.simplexsmp.airtagquest
        INFOPLIST_KEY_CFBundleDisplayName: "AirTag: Lost Signal"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
